syntax = "proto3";

package paulwwyvern.gophkeeper_proto;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/paulwwyvern/gophkeeper-proto/";

service GophkeeperService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetSalt(GetSaltRequest) returns (GetSaltResponse);

  // методы защищённые auth middleware
  rpc GetUser(google.protobuf.Empty) returns (User);
  rpc PushChanges(PushChangesRequest) returns (google.protobuf.Empty);
  rpc PullChanges(PullChangesRequest) returns (PullChangesResponse);

    rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);

  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileResponse);
}


message User {
  int32 id = 1;
  string login = 2;
  bytes salt = 3;
  bytes vaultKey = 4;
  bytes vaultKey_nonce = 5;
}


message VaultItem {
  bytes id = 1;
  int32 label = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;

  bytes encrypted_nonce = 8;
  bytes encrypted = 9;

  bool is_deleted = 10;
}


message CreateUserRequest {
  User user = 1;
  bytes auth_key = 2;
}


message CreateUserResponse {
  int32 id = 1;
}

message LoginRequest {
  string login = 1;
  bytes authKey = 2;
  bytes device_id = 3;
}

message LoginResponse { 
  string token = 1;
}


message GetSaltRequest {
  string login = 1;
}

message GetSaltResponse {
  bytes salt = 2;
}


message PushChangesRequest {
  repeated VaultItem items = 1;
}

message PullChangesRequest {
  google.protobuf.Timestamp last_sync_time = 1;

  int32 offset = 2;
}

message PullChangesResponse {
  repeated VaultItem items = 1;
  google.protobuf.Timestamp sync_time = 2;

  bool has_more = 3;
}


// Вся доступная инфа про файл
message FileInfo {
  int64 size = 2;
}

// Сами данные
message FileChunk {
  int64 offset = 1;
  bytes data = 2;
}

// Контрольная сумма
message FileChecksum {
  bytes checksum = 1;
  string algo = 2;
}



// Порядок оправки такой
// 1) Ровно один message FileInfo
// 2) Какое то количество FileChunk
// 3) Ровно один FileChecksum
message UploadFileRequest {
  oneof payload {
    FileInfo info = 1;
    FileChunk chunk = 2;
    FileChecksum checksum = 3;
  }
}


message UploadFileResponse {
  int32 file_id = 1;
}


message DownloadFileRequest {
  int32 file_id = 1;
}

// Порядок оправки такой
// 1) Ровно один message FileInfo
// 2) Какое то количество FileChunk
// 3) Ровно один FileChecksum
message DownloadFileResponse {
  oneof payload {
    FileInfo info = 1;
    FileChunk chunk = 2;
    FileChecksum checksum = 3;
  }
}
